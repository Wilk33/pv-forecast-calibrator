name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Home Assistant app configuration
        uses: frenck/action-app-linter@v2
        with:
          path: "./pv-forecast-calibrator"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r pv-forecast-calibrator/rootfs/requirements.txt
      - name: Verify generated runtime copy
        run: |
          python tools/sync_runtime.py
          git diff --exit-code
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q pv_forecast_calibrator pv-forecast-calibrator/rootfs/usr/src/app/pv_forecast_calibrator
